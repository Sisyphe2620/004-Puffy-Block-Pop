<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Puffy Block Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  /* Puffy skin: cream / lavender / sage / candy pink, a cosy toy-room. HUD pieces are painted sprites; every number is live text on top. */
  --purple:#7B52C4;
  --purple-d:#5E3AA6;
  --plum:#6B4A8C;
  --cream:#FFF3E6;
  --pink:#F59BC0;
  --coral:#F28B7A;
  --sage:#7FB85A;
  --font-num:"Fredoka","Baloo 2","Nunito","Arial Rounded MT Bold","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-ui:"Fredoka","Nunito","Arial Rounded MT Bold","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --trayH:clamp(130px,19vh,176px);
  --mainTop:140px;--mainH:420px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#BDB5E8;
  font-family:var(--font-ui);color:var(--purple-d);overflow:hidden;
  touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}

[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:2;touch-action:none}

/* ---------- loading screen: painted scene + live progress bar ---------- */
#ld{position:fixed;inset:0;z-index:100;background:#E9CDB8;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
#ld.done{opacity:0;pointer-events:none}

.mute .x{display:none;position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.hbtn.off+.x{display:block}
.hbtn.off{filter:saturate(.55) brightness(1.04)}

/* level badge: the whole bear + green label moves as one; the text is live */
.lv .cat{position:absolute;inset:0;transform-origin:50% 100%;animation:catIdle 5.2s ease-in-out infinite;will-change:transform}
#hud .lv .cat img.bd{display:none}#hud .lv .cat img.bd.on{display:block}
.lv .lvt{position:absolute;left:var(--lx,50%);top:var(--ly,75.5%);transform:translate(-50%,-50%);text-align:center;white-space:nowrap;font:700 calc(17cqw*var(--lk,1))/1 var(--font-num);letter-spacing:.02em;color:#FFF6E8;
  text-shadow:0 1.1cqw 0 rgba(76,120,44,.65),0 0 2cqw rgba(60,110,40,.25)}
.lv .lvt b{font-weight:700}
@keyframes catIdle{
  0%,100%{transform:translateY(0) scale(1,1)}
  30%{transform:translateY(-1.2%) scale(.995,1.02)}
  60%{transform:translateY(0) scale(1.012,.99)}
  80%{transform:translateY(-.6%) scale(1,1.01)}
}
@media (prefers-reduced-motion:reduce){.lv .cat{animation:none}}
.note{position:absolute;pointer-events:none;font-family:var(--font-ui);font-weight:700;line-height:1;font-size:14cqw;opacity:0;
  text-shadow:0 .8cqw 0 rgba(255,255,255,.9);animation:noteUp 2.5s ease-out forwards;z-index:2}
@keyframes noteUp{
  0%{opacity:0;transform:translate(0,0) scale(.5) rotate(-12deg)}
  16%{opacity:1;transform:translate(calc(var(--dx)*.2),-8cqw) scale(1) rotate(8deg)}
  55%{opacity:1;transform:translate(calc(var(--dx)*.7),-24cqw) scale(1.05) rotate(-8deg)}
  100%{opacity:0;transform:translate(var(--dx),-40cqw) scale(.9) rotate(10deg)}
}
@media (prefers-reduced-motion:reduce){.note{display:none}}

/* live numbers */
.num{position:absolute;transform:translate(-50%,-50%);line-height:1;white-space:nowrap;font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums}
.num span{display:inline-block}
.sb .num{left:50.2%;top:60.5%;font-size:27cqw;color:#fff;text-shadow:0 1.4cqw 0 rgba(86,48,150,.55),0 0 3cqw rgba(255,255,255,.25)}
.sb .num[data-len="4"]{font-size:25cqw}.sb .num[data-len="5"]{font-size:20cqw}.sb .num[data-len="6"]{font-size:16.5cqw}.sb .num[data-len="7"]{font-size:14cqw}
.cb .num{left:51.5%;top:50%;font-size:17cqw;color:var(--purple-d);text-shadow:0 .7cqw 0 rgba(255,255,255,.8)}
.cb .num[data-len="3"]{font-size:13.5cqw}.cb .num[data-len="4"]{font-size:10.8cqw}.cb .num[data-len="5"]{font-size:9cqw}
.gl .lab{position:absolute;left:16.6%;top:50%;transform:translateY(-50%);white-space:nowrap;font:600 4.3cqw/1 var(--font-ui);color:var(--purple-d)}
.gl .trk{position:absolute;left:43.6%;width:38.4%;top:26.9%;height:37.3%;border-radius:99px;overflow:hidden}
.gl #fill{height:100%;width:0;border-radius:99px;background:linear-gradient(180deg,#F8B9D9,#D77FD0 50%,#A878E6);box-shadow:inset 0 .5cqw 0 rgba(255,255,255,.55),0 0 1.4cqw rgba(214,120,214,.55);transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.gl .num{left:90.8%;top:50%;font-size:4.5cqw;font-family:var(--font-num);font-weight:600;color:var(--purple-d)}
.bump{animation:bump .34s ease-out}
@keyframes bump{40%{transform:scale(1.2)}}

#hint{position:fixed;z-index:3;left:0;right:0;text-align:center;pointer-events:none;margin:0;font-size:12px;color:rgba(94,58,166,.75);
  bottom:calc(23.8% + 54px);font-size:11px;transition:opacity .6s}
#pops{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
/* floating words: white candy lettering with a coloured outline (purple / sage / coral) */
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-num);font-size:30px;font-weight:700;color:#fff;white-space:nowrap;letter-spacing:.02em;
  -webkit-text-stroke:6px #8A5AD8;paint-order:stroke fill;text-shadow:0 3px 0 rgba(90,50,150,.45);animation:floatUp 1.1s ease-out forwards}
.pop.gold{-webkit-text-stroke-color:#58A96E;text-shadow:0 3px 0 rgba(40,110,70,.4)}
.pop.fire{-webkit-text-stroke-color:#E8588F;text-shadow:0 3px 0 rgba(160,40,90,.4)}
.pop.small{font-size:21px;-webkit-text-stroke-width:5px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

/* ---------- shuffle button ---------- */

#shuf:active{transform:translate(-50%,-50%) scale(.92)}
#shuf.spin{animation:shspin .6s ease}
@keyframes shspin{40%{transform:translate(-50%,-50%) scale(1.14) rotate(14deg)}}
#shuf .shn{position:absolute;left:55%;top:54.5%;width:42%;height:42%;display:flex;align-items:center;justify-content:center;border-radius:50%;
  color:#fff;font:700 22cqw/1 var(--font-num);text-shadow:0 .8cqw 0 rgba(150,50,40,.45)}
#shuf .shn.cost{background:linear-gradient(180deg,#FFE7A0,#F1B93C);color:#6B4300;text-shadow:none;box-shadow:inset 0 -.8cqw 0 rgba(160,100,0,.25),0 .6cqw 1.6cqw rgba(160,110,0,.35)}
#shuf.off{filter:grayscale(1) brightness(.85);opacity:.7}

/* ---------- tutorial ---------- */
#tut{position:fixed;inset:0;z-index:4;pointer-events:none}
#tuttxt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(23.8% + 62px);max-width:88%;padding:9px 18px;border-radius:99px;text-align:center;white-space:nowrap;
  background:linear-gradient(180deg,#FFF8F0,#FBE8DB);border:3px solid #CDB2F0;color:var(--purple-d);font:600 15px/1.2 var(--font-ui);
  box-shadow:0 4px 0 rgba(150,110,200,.4),0 8px 18px rgba(110,70,160,.25);animation:tutpulse 1.2s ease-in-out infinite}
@keyframes tutpulse{50%{transform:translateX(-50%) scale(1.05)}}
#tuthand{position:absolute;left:0;top:0;width:0;height:0;opacity:0}
#tuthand i{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(214,170,255,.6) 45%,rgba(214,170,255,0) 72%)}
#tuthand b{position:absolute;left:-6px;top:-4px;font-size:34px;line-height:1;filter:drop-shadow(0 2px 4px rgba(90,50,130,.4));font-weight:400}
@keyframes bump2{30%{transform:scale(1.6);filter:brightness(1.1) drop-shadow(0 0 8px #F59BC0)}100%{transform:scale(1);filter:none}}
.bump2{animation:bump2 .55s ease-out}
@keyframes fillhit{0%{filter:brightness(1.25) saturate(1.4)}100%{filter:none}}
.fillhit{animation:fillhit .8s ease-out}
.fcoin{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;pointer-events:none;z-index:5;will-change:transform;
  background:radial-gradient(circle at 35% 30%,#FFF6B0,#FFC62A 55%,#E08E00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 2px 5px rgba(160,100,0,.4)}
@keyframes mascotCheer{0%{transform:none}14%{transform:translateY(2%) scale(1.08,.9)}38%{transform:translateY(-8%) scale(.95,1.1) rotate(-4deg)}58%{transform:translateY(-2%) rotate(3deg)}76%{transform:translateY(0) scale(1.04,.97)}100%{transform:none}}
@keyframes mascotCheer2{0%{transform:none}10%{transform:translateY(3%) scale(1.1,.86)}28%{transform:translateY(-13%) scale(.93,1.13) rotate(-7deg)}46%{transform:translateY(0) scale(1.07,.93)}62%{transform:translateY(-8%) scale(.96,1.07) rotate(6deg)}80%{transform:translateY(0) scale(1.03,.98)}100%{transform:none}}
@keyframes mascotHype{0%{filter:brightness(1.12) saturate(1.2)}100%{filter:brightness(1) saturate(1)}}
@keyframes mascotSad{0%{transform:none;filter:none}100%{transform:translateY(3%) rotate(-5deg) scale(.97);filter:brightness(.9) saturate(.75)}}
.lv.cheer .cat{animation:mascotCheer .72s ease-out 1,mascotHype .72s ease-out 1}
.lv.cheer2 .cat{animation:mascotCheer2 1.05s ease-out 1,mascotHype 1.05s ease-out 1}
.lv.sad .cat{animation:mascotSad .9s ease-out forwards}
@media (prefers-reduced-motion:reduce){.bump2,.fillhit{animation:none}}

/* ---------- popup cards ---------- */
.overlay{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(96,70,150,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.pcard{position:relative;width:min(100%,340px);padding:28px 22px 24px;text-align:center;border-radius:34px;border:4px solid #E6D4F7;
  background:linear-gradient(180deg,#FFF8F0,#FBE7DB);color:var(--purple-d);
  box-shadow:0 9px 0 rgba(150,110,200,.4),0 20px 40px rgba(90,60,140,.35);animation:cardIn .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes cardIn{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.pcard h2{margin:0 0 10px;font:700 33px/1.1 var(--font-num);letter-spacing:.01em;color:var(--purple);text-shadow:0 2px 0 #fff}
.pcard p,.pcard .l2{margin:0 0 20px;font-size:16px;line-height:1.45;color:#7a6694;font-weight:500}
.pcard .l1{margin:0 0 8px;font:600 16px/1.35 var(--font-ui);color:var(--plum);text-wrap:balance}
.btns{display:flex;flex-direction:column;gap:14px}
.pbtn{height:56px;width:100%;border:0;cursor:pointer;font-family:var(--font-ui);font-weight:700;font-size:21px;letter-spacing:.05em;border-radius:28px;color:#fff;
  background:linear-gradient(180deg,#9AD36F,#6BAA45);box-shadow:0 5px 0 #4F8431,0 9px 16px rgba(70,110,40,.3);text-shadow:0 2px 0 rgba(60,100,30,.5);
  -webkit-tap-highlight-color:transparent;transition:transform .08s,box-shadow .08s}
.pbtn.alt{background:linear-gradient(180deg,#CDB0F5,#A07EE0);box-shadow:0 5px 0 #7753BD,0 9px 16px rgba(100,70,170,.3);text-shadow:0 2px 0 rgba(80,50,140,.5)}
.pbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #4F8431,0 3px 8px rgba(70,110,40,.3)}
.pbtn.alt:active{box-shadow:0 1px 0 #7753BD,0 3px 8px rgba(100,70,170,.3)}
.pbtn:focus-visible,.hbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.bump,.pop,.pcard{animation:none}.gl #fill{transition:none}}
</style>
</head>

<script>
/*LOGIC*/
var N=8,GOAL=10;
var SHAPES=[
  ['#'],['##'],['#','#'],['###'],['#','#','#'],['####'],['#','#','#','#'],['#####'],['#','#','#','#','#'],
  ['##','##'],['###','###','###'],['###','###'],['##','##','##'],
  ['#.','##'],['.#','##'],['##','#.'],['##','.#'],
  ['#..','#..','###'],['..#','..#','###'],['###','#..','#..'],['###','..#','..#'],
  ['###','.#.'],['.#.','###'],['#.','##','#.'],['.#','##','.#'],
  ['##.','.##'],['.##','##.'],['#.','##','.#'],['.#','##','#.'],
  ['#.','#.','##'],['.#','.#','##'],['##','#.','#.'],['##','.#','.#'],
  ['###','#..'],['###','..#'],['#..','###'],['..#','###']
];
var START=['........','........','........','........','........','........','........','........'];
var FIRST_SET=[['##','##'],['###'],['#.','##']];
var SYMCOL={r:0,o:1,y:2,g:3,b:4,p:5};
function emptyGrid(){var g=[],i,j;for(i=0;i<N;i++){g.push([]);for(j=0;j<N;j++)g[i].push(null)}return g}
function parsePiece(rows,color){
  var cells=[],w=0,h=0;
  rows.forEach(function(s,r){for(var c=0;c<s.length;c++)if(s[c]==='#'){cells.push({r:r,c:c,t:'cube'});w=Math.max(w,c+1);h=Math.max(h,r+1)}});
  return {cells:cells,w:w,h:h,color:color};
}
function fits(grid,p,r,c){
  for(var i=0;i<p.cells.length;i++){
    var rr=r+p.cells[i].r,cc=c+p.cells[i].c;
    if(rr<0||cc<0||rr>=N||cc>=N||grid[rr][cc])return false;
  }
  return true;
}
function anyFit(grid,p){for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(fits(grid,p,r,c))return true;return false}
function findFull(grid){
  var rows=[],cols=[],i,j;
  for(i=0;i<N;i++){
    var fr=true,fc=true;
    for(j=0;j<N;j++){if(!grid[i][j])fr=false;if(!grid[j][i])fc=false}
    if(fr)rows.push(i);if(fc)cols.push(i);
  }
  return {rows:rows,cols:cols};
}
function previewLines(grid,p,r,c){
  var rows=[],cols=[],i,j;
  function occ(a,b){
    if(grid[a][b])return true;
    for(var k=0;k<p.cells.length;k++)if(r+p.cells[k].r===a&&c+p.cells[k].c===b)return true;
    return false;
  }
  for(i=0;i<N;i++){
    var fr=true,fc=true;
    for(j=0;j<N;j++){if(!occ(i,j))fr=false;if(!occ(j,i))fc=false}
    if(fr)rows.push(i);if(fc)cols.push(i);
  }
  return {rows:rows,cols:cols};
}
/* Clears full lines, then lets bombs blow up their 3x3 neighbourhood (chains allowed).
   chest: opens, skull: needs two hits. Returns ordered steps with a parent link for timing. */
function resolve(grid,rows,cols){
  var steps=[],seen={},queue=[],i,j;
  function enq(r,c,parent,cause,ai){
    if(r<0||c<0||r>=N||c>=N)return;
    var k=r*N+c;if(seen[k]||!grid[r][c])return;
    seen[k]=1;queue.push({r:r,c:c,parent:parent,cause:cause,ai:ai||0});
  }
  rows.forEach(function(r){for(j=0;j<N;j++)enq(r,j,-1,'line')});
  cols.forEach(function(c){for(i=0;i<N;i++)enq(i,c,-1,'line')});
  var qi=0;
  while(qi<queue.length){
    var q=queue[qi++],cell=grid[q.r][q.c],step={r:q.r,c:q.c,cell:cell,parent:q.parent,cause:q.cause,ai:q.ai};
    if(cell.t==='skull'){
      cell.hp--;
      if(cell.hp>0){step.kind='hit';steps.push(step);continue}
      step.kind='kill';grid[q.r][q.c]=null;steps.push(step);
    }else if(cell.t==='chest'){
      step.kind='chest';grid[q.r][q.c]=null;steps.push(step);
    }else if(cell.t==='crystal'){
      step.kind='crystal';grid[q.r][q.c]=null;step.targets=[];steps.push(step);
      var cidx=steps.length-1,cand=[];
      for(i=0;i<N;i++)for(j=0;j<N;j++)if(grid[i][j]&&!seen[i*N+j])cand.push({r:i,c:j});
      var want=Math.min(cand.length,3+Math.floor(Math.random()*3));
      for(i=0;i<want;i++){
        var pk=Math.floor(Math.random()*cand.length),tg=cand.splice(pk,1)[0];
        step.targets.push(tg);enq(tg.r,tg.c,cidx,'arc',i);
      }
    }else if(cell.t==='bomb'){
      step.kind='bomb';grid[q.r][q.c]=null;steps.push(step);
      var idx=steps.length-1;
      for(i=-1;i<=1;i++)for(j=-1;j<=1;j++)if(i||j)enq(q.r+i,q.c+j,idx,'blast');
    }else{
      step.kind='clear';grid[q.r][q.c]=null;steps.push(step);
    }
  }
  return steps;
}
function lineScore(n){return [0,20,60,120,200,300][Math.min(n,5)]}
var COINS_PER_CHEST=6,SHUFFLE_COST=12;   /* coins are a wallet that carries over from level to level; once the 3 free re-deals are used a re-deal costs 12 coins (two chests) */

/* ---- layout ---- */
function measure(){

  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  hudBottom=$('hud').getBoundingClientRect().bottom;
  var d=$('dock').getBoundingClientRect();
  trayRect={x:0,y:d.top,w:W,h:d.height};
  var top=hudBottom+4,bot=d.top-6;
  mainRect={x:0,y:top,w:W,h:Math.max(140,bot-top)};
  var de=document.documentElement;
  if(de&&de.style&&de.style.setProperty){de.style.setProperty('--mainTop',mainRect.y+'px');de.style.setProperty('--mainH',mainRect.h+'px')}
  BS=Math.min(W*.985/BW,(mainRect.h-6)/BH);BX=(W-BW*BS)/2;BY=mainRect.y+(mainRect.h-BH*BS)/2;
  CV=[(GRID[4][4][0]-GRID[4][3][0])*BS,(GRID[4][4][1]-GRID[4][3][1])*BS];
  RV=[(GRID[4][3][0]-GRID[3][3][0])*BS,(GRID[4][3][1]-GRID[3][3][1])*BS];

function slotX(i){return W/2+(i-1)*W*.3}

/* ---- tray + dragged pieces ---- */

  var ex=p.w*Math.abs(CV[0])+p.h*Math.abs(RV[0]),ey=p.h*Math.abs(RV[1])+p.w*Math.abs(CV[1])+PITCH0*.75;
  return Math.max(.2,Math.min(.74,W*.28/ex,trayRect.h*.8/ey));
}
function sortedCells(p){return p.cells.slice().sort(function(a,b){return a.r-b.r||a.c-b.c})}

    P0.gy=G.y;drawBlock(imgFor(q.t,p.color,false),P0,f,1,1,1,0,.22);

/* ---- one frame ---- */
function render(now){

  var ip=intro.on?Math.min(1,(now-intro.t0)/intro.dur):1,ie=ease(ip);

  if(punch>0){var pk=Math.min(1,punch);zoom=1+.03*pk*pk*(3-2*pk)}

  ctx.translate(cx0+(Math.random()-.5)*shake.amp*14,cy0+(Math.random()-.5)*shake.amp*14);ctx.scale(zoom,zoom);ctx.translate(-cx0,-cy0);
  ctx.globalAlpha=ie;
  if(SPR.board&&SPR.board.complete)ctx.drawImage(SPR.board,BX,BY,BW*BS,BH*BS);
  ctx.globalAlpha=1;
  var t=now/1000,i,k;

  if(hl.list.length){
    ctx.fillStyle=hl.hex;ctx.globalAlpha=.32+.14*Math.sin(t*7);
    for(i=0;i<hl.list.length;i++){tilePath((hl.list[i]/N)|0,hl.list[i]%N,.47);ctx.fill()}
    ctx.globalAlpha=1;
  }
  /* tutorial gap */
  if(tutorial){
    var pu=.5+.5*Math.sin(now/260);ctx.fillStyle='#FFFFFF';ctx.globalAlpha=.25+.5*pu;
    for(var tr=TUT_R;tr<TUT_R+2;tr++)for(var tc=TUT_C;tc<TUT_C+3;tc++){tilePath(tr,tc,.47);ctx.fill()}
    ctx.globalAlpha=1;
  }
  /* tile flashes */
  for(i=flashes.length-1;i>=0;i--){
    var F=flashes[i],fp=(now-F.t0)/460;
    if(fp>=1){flashes.splice(i,1);continue}if(fp<0)continue;
    tilePath((F.i/N)|0,F.i%N,.47);ctx.fillStyle=F.hex;ctx.globalAlpha=.75*Math.pow(1-fp,1.4);ctx.fill();
  }
  ctx.globalAlpha=1;
  /* sweeping light bars */
  for(i=bars.length-1;i>=0;i--){
    var B=bars[i],bp=(now-B.t0)/560;
    if(bp>=1){bars.splice(i,1);continue}if(bp<0)continue;
    var half=.5*(1+.9*bp),ext=.15+.85*ease(Math.min(1,bp*2.8)),lo=3.5-4.1*ext,hi=3.5+4.1*ext,a0,a1,a2,a3;
    if(B.row){a0=gridP(lo,B.idx-half);a1=gridP(hi,B.idx-half);a2=gridP(hi,B.idx+half);a3=gridP(lo,B.idx+half)}
    else{a0=gridP(B.idx-half,lo);a1=gridP(B.idx-half,hi);a2=gridP(B.idx+half,hi);a3=gridP(B.idx+half,lo)}
    ctx.beginPath();ctx.moveTo(BX+a0[0]*BS,BY+a0[1]*BS);ctx.lineTo(BX+a1[0]*BS,BY+a1[1]*BS);ctx.lineTo(BX+a2[0]*BS,BY+a2[1]*BS);ctx.lineTo(BX+a3[0]*BS,BY+a3[1]*BS);ctx.closePath();

  }

  /* burst glows on the tiles */
  for(i=glows.length-1;i>=0;i--){
    var Gl=glows[i],gp=(now-Gl.t0)/460;
    if(gp>=1){glows.splice(i,1);continue}if(gp<0)continue;
    var gq=proj(Gl.x,0,Gl.z),gr=(.5+1.7*ease(gp))*gq.p*.5;
    var gg=ctx.createRadialGradient(gq.x,gq.y,0,gq.x,gq.y,gr);gg.addColorStop(0,Gl.hex);gg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.save();ctx.globalAlpha=.75*Math.pow(1-gp,1.4);ctx.translate(gq.x,gq.y);ctx.scale(1,.62);ctx.translate(-gq.x,-gq.y);ctx.fillStyle=gg;ctx.beginPath();ctx.arc(gq.x,gq.y,gr,0,6.2832);ctx.fill();ctx.restore();
  }

    var SK=shocks[i],sa=(now-SK.t0)/1000;

  for(i=0;i<items.length;i++){
    var n=items[i],P0=proj(n.x,n.y+(n.ghost?0:shockBump(n,now)),n.z);
    if(n.ghost){P0.gy=P0.y}else{var G0=proj(n.x,0,n.z);P0.gy=G0.y}
    drawBlock(imgFor(n.t,n.color,n.cracked),P0,1,n.a,n.sx,n.sy,n.rot,n.ghost?0:(.2*Math.min(1,n.a)));
  }
  /* sparks, confetti, coins */
  for(i=0;i<parts.length;i++){
    var q=parts[i],pp=proj(q.x,q.y,q.z),rem=q.life-q.age,sc=rem<.25?Math.max(.001,rem/.25):1,sz=q.sz*pp.p*sc;

var AC=null,sfxOn=true;

function tone(f,t0,d,type,g,f2){

    var t=AC.currentTime+t0,o=AC.createOscillator(),a=AC.createGain();

    o.connect(a);a.connect(AC.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}

/* a happy puppy "yip": a sawtooth voice with a quick up-then-down pitch glide, shaped by two gliding vowel formants (ah -> ee) */
function yip(t0,pitch,vol){

    var t=AC.currentTime+t0,d=.17+Math.random()*.05,o=AC.createOscillator(),a=AC.createGain(),
        fa=AC.createBiquadFilter(),fb=AC.createBiquadFilter(),ga=AC.createGain(),gb=AC.createGain();

    o.frequency.setValueAtTime(pitch*.8,t);o.frequency.exponentialRampToValueAtTime(pitch*1.38,t+.05);o.frequency.exponentialRampToValueAtTime(pitch*1.02,t+d);
    fa.type='bandpass';fa.Q.value=5;fa.frequency.setValueAtTime(480,t);fa.frequency.linearRampToValueAtTime(900,t+.07);fa.frequency.linearRampToValueAtTime(720,t+d);
    fb.type='bandpass';fb.Q.value=6;fb.frequency.setValueAtTime(2300,t);fb.frequency.linearRampToValueAtTime(1750,t+.07);fb.frequency.linearRampToValueAtTime(2700,t+d);
    ga.gain.value=1;gb.gain.value=.55;
    a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(vol,t+.018);a.gain.setValueAtTime(vol,t+.06);a.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(fa);o.connect(fb);fa.connect(ga);fb.connect(gb);ga.connect(a);gb.connect(a);a.connect(AC.destination);

}
function boom(){

    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);

function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
/* ---------- background music: bouncy future-pop loop for Neon Block Pop (C - G - Am - F), 112 BPM ---------- */

/* one background tune per pet: same bouncy future-pop family (bass + chord stabs + lead + pops + side-chained kick), different key, tempo, groove and timbre */
function mkTrack(o){
  var ch=o.prog.map(function(c,i){
    var pc=c[0],min=c[1],base=60+pc-(pc>5?12:0),t=[base,base+(min?3:4),base+7];
    var pat=(i===3?o.b:o.a),mel=[];
    for(var k=0;k<16;k++){var d=pat.charAt(k);var n=d==='.'?0:t[(+d)%3]+12+12*Math.floor(+d/3);if(n>86)n-=12;mel.push(n)}

/* coming back from another tab / app: browsers (iOS above all) keep the audio engine asleep until the next touch, so wake it on return AND on the first touch, and restart the music clock so it does not try to catch up on the time that was missed */
var audioStale=false,lastRebuild=0;
function rebuildAudio(){   /* last resort: the old engine will not wake (iOS 'interrupted'), so make a brand-new one and rebuild the music graph on it */
  var oldAC=AC;if(oldAC)setTimeout(function(){try{oldAC.close()}catch(e){}},4000);   /* let anything already scheduled on the old engine finish */
  AC=null;MU.m=null;MU.arp=null;MU.pg=null;MU.pad=null;MU.dl=null;MU.nb=null;
  if(MU.timer){clearInterval(MU.timer);MU.timer=null}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    var rs=AC.resume();if(rs&&rs.catch)rs.catch(function(){});
    var ub=AC.createBuffer(1,1,22050),us=AC.createBufferSource();us.buffer=ub;us.connect(AC.destination);us.start(0);   /* silent blip: unlocks iOS inside the touch */
  }catch(e){AC=null}

  musicSync();
  var rn=0,rt=setInterval(function(){   /* keep nudging it awake for a few seconds; if it is still asleep the next touch tries again */
    if(!AC||AC.state==='running'||++rn>10){clearInterval(rt);if(AC&&AC.state!=='running')audioStale=true;return}
    try{var q=AC.resume();if(q&&q.catch)q.catch(function(){})}catch(e){}
  },300);
}
function wakeAudio(fromTouch){
  if(!AC||document.hidden)return;
  try{
    /* after a trip to the background iOS can still say 'running' while nothing is audible, so the first touch always builds a fresh engine */
    if(AC.state==='closed'||fromTouch&&(audioStale||AC.state!=='running'&&Date.now()-lastRebuild>250)){rebuildAudio();return}
    if(AC.state!=='running'){var pr=AC.resume();if(pr&&pr.catch)pr.catch(function(){})}
    if(MU.timer)MU.t=Math.max(MU.t,AC.currentTime+.08);
    musicSync();
  }catch(e){}
}
if(document.addEventListener){
  document.addEventListener('visibilitychange',function(){
    if(!AC)return;
    if(document.hidden){audioStale=true;if(MU.timer){clearInterval(MU.timer);MU.timer=null}}
    else wakeAudio(false);
  });
  window.addEventListener('pageshow',function(){audioStale=true;wakeAudio(false)});
  /* iOS only treats the END of a touch (touchend / click) as permission to make sound, so the engine is rebuilt there, not on touchstart */
  ['touchstart','pointerdown'].forEach(function(ev){document.addEventListener(ev,function(){
    if(AC&&AC.state!=='running'){try{var q=AC.resume();if(q&&q.catch)q.catch(function(){})}catch(e){}}
  },true)});
  ['touchend','click'].forEach(function(ev){document.addEventListener(ev,function(){
    if(!AC)return;
    if(audioStale||AC.state!=='running')wakeAudio(true);
  },true)});
  /* Chrome (and others) may freeze the page without ever saying "hidden": notice it from the page lifecycle events, from a gap in our own timer, or from the audio clock falling behind the wall clock, and have the next touch build a fresh engine */
  ['pagehide','freeze','blur'].forEach(function(ev){window.addEventListener(ev,function(){audioStale=true;if(MU.timer){clearInterval(MU.timer);MU.timer=null}})});
  ['resume','focus'].forEach(function(ev){(ev==='resume'?document:window).addEventListener(ev,function(){wakeAudio(false)})});
  var wdW=0,wdA=-1,wdN=0,wdAC=null,wdRan=false;
  setInterval(function(){
    if(!AC||document.hidden||!sfxOn)return;
    try{
      var nw=Date.now();
      if(AC!==wdAC){wdAC=AC;wdA=-1;wdN=0;wdRan=false}   /* a fresh engine starts its own clock */
      if(wdW&&nw-wdW>1800)audioStale=true;                                   /* our own timer was frozen */
      if(AC.state==='running')wdRan=true;
      if(AC.state!=='running'){if(wdRan)audioStale=true}

}

    });

  }else if(s.kind==='bomb'){
    tween(t,220,function(p){var sc=1+.45*Math.sin(p*Math.PI*2.5)*(.4+p);m.sx=m.sy=sc});

function checkLose(){
  if(over||overlayOpen||!pieces)return;
  if(pieces.every(function(q){return !q}))return;   /* all three just placed: a fresh set is about to be dealt, nothing to judge yet */
  if(drag){later(400,checkLose);return}   /* a finger is on a piece right now: look again once it lets go */
  if(!pieces.some(function(p){return p&&anyFit(grid,p)})){over=true;showOverlay('lose')}
}
/* one squeaky cyber-sprite voice: triangle + a little square, vibrato, a falling (or rise-and-fall) glide, shaped by two vowel-ish formants */
function spriteCry(bus,t0,f,d,vol,glide,rise){
  try{
    var t=AC.currentTime+t0,o=AC.createOscillator(),o2=AC.createOscillator(),lfo=AC.createOscillator(),lg=AC.createGain(),a=AC.createGain(),
        fa=AC.createBiquadFilter(),fb=AC.createBiquadFilter(),ga=AC.createGain(),gb=AC.createGain(),g2=AC.createGain();
    o.type='triangle';o2.type='square';
    o.frequency.setValueAtTime(f*(rise?.8:1.08),t);
    if(rise){o.frequency.exponentialRampToValueAtTime(f*1.35,t+d*.35);o.frequency.exponentialRampToValueAtTime(f*.85,t+d)}
    else o.frequency.exponentialRampToValueAtTime(f*(glide||.92),t+d);
    o2.frequency.setValueAtTime(f*2.01,t);o2.frequency.exponentialRampToValueAtTime(f*2*(rise?.9:(glide||.92)),t+d);
    lfo.frequency.value=6+Math.random()*3;lg.gain.value=f*.022;lfo.connect(lg);lg.connect(o.frequency);
    fa.type='bandpass';fa.Q.value=4;fa.frequency.setValueAtTime(1000,t);fa.frequency.linearRampToValueAtTime(1500,t+d);
    fb.type='bandpass';fb.Q.value=6;fb.frequency.setValueAtTime(3000,t);fb.frequency.linearRampToValueAtTime(2300,t+d);
    ga.gain.value=1;gb.gain.value=.6;g2.gain.value=.22;
    a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(vol,t+.035);a.gain.setValueAtTime(vol,t+d*.55);a.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(fa);o.connect(fb);o2.connect(g2);g2.connect(fa);fa.connect(ga);fb.connect(gb);ga.connect(a);gb.connect(a);a.connect(bus);
    o.start(t);o2.start(t);lfo.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);lfo.stop(t+d+.05);
  }catch(e){}
}
/* one little puppy: a quick "yip" (short, pitch drops, with a breathy consonant) or a longer "awoo" whine (pitch rises, then sags, with a wobble) */
var PUPN=null;
function puppyCry(bus,t0,f,d,vol,whine){
  try{
    var t=AC.currentTime+t0,o=AC.createOscillator(),o2=AC.createOscillator(),lfo=AC.createOscillator(),lg=AC.createGain(),a=AC.createGain(),
        fa=AC.createBiquadFilter(),fb=AC.createBiquadFilter(),ga=AC.createGain(),gb=AC.createGain(),g2=AC.createGain();
    o.type='sawtooth';o2.type='triangle';
    if(whine){
      o.frequency.setValueAtTime(f*.82,t);o.frequency.exponentialRampToValueAtTime(f*1.28,t+d*.38);o.frequency.exponentialRampToValueAtTime(f*.9,t+d);
      lfo.frequency.value=5+Math.random()*2;lg.gain.value=f*.03;
    }else{
      o.frequency.setValueAtTime(f*1.3,t);o.frequency.exponentialRampToValueAtTime(f*.78,t+d);
      lfo.frequency.value=0.1;lg.gain.value=0;
    }
    o2.frequency.setValueAtTime(f*2,t);o2.frequency.exponentialRampToValueAtTime(f*(whine?1.8:1.5),t+d);
    lfo.connect(lg);lg.connect(o.frequency);
    /* vowel: "yi-ap" for a yip (mouth opens), "oo" for a whine */
    fa.type='bandpass';fa.Q.value=5;fb.type='bandpass';fb.Q.value=7;
    if(whine){fa.frequency.setValueAtTime(520,t);fa.frequency.linearRampToValueAtTime(380,t+d);fb.frequency.setValueAtTime(1500,t);fb.frequency.linearRampToValueAtTime(1100,t+d)}
    else{fa.frequency.setValueAtTime(420,t);fa.frequency.linearRampToValueAtTime(1000,t+d*.45);fb.frequency.setValueAtTime(2300,t);fb.frequency.linearRampToValueAtTime(1700,t+d)}
    ga.gain.value=1;gb.gain.value=.55;g2.gain.value=.3;
    a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(vol,t+(whine?.06:.012));
    if(whine)a.gain.setValueAtTime(vol,t+d*.6);
    a.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(fa);o.connect(fb);o2.connect(g2);g2.connect(fa);fa.connect(ga);fb.connect(gb);ga.connect(a);gb.connect(a);a.connect(bus);
    o.start(t);o2.start(t);lfo.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);lfo.stop(t+d+.05);
    if(!whine){   /* the little breathy "h" at the start of a bark */
      if(!PUPN){var len=Math.floor(AC.sampleRate*.1);PUPN=AC.createBuffer(1,len,AC.sampleRate);var dd=PUPN.getChannelData(0);for(var i=0;i<len;i++)dd[i]=Math.random()*2-1}
      var ns=AC.createBufferSource(),nf=AC.createBiquadFilter(),ng=AC.createGain();
      ns.buffer=PUPN;nf.type='bandpass';nf.frequency.value=2200;nf.Q.value=1.2;
      ng.gain.setValueAtTime(vol*.5,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.07);
      ns.connect(nf);nf.connect(ng);ng.connect(bus);ns.start(t);ns.stop(t+.1);
    }
  }catch(e){}
}
/* one muted toy-trombone note: soft saw through a wobbling low-pass ("wah"); the last note droops down with a wobble */
function failWah(bus,f,t0,d,droop){
  try{
    var t=AC.currentTime+t0,o=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter(),a=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
    o.type='sawtooth';o2.type='square';
    o.frequency.setValueAtTime(f,t);o2.frequency.setValueAtTime(f*1.004,t);
    if(droop){o.frequency.setValueAtTime(f,t+d*.35);o.frequency.exponentialRampToValueAtTime(f*.72,t+d);o2.frequency.setValueAtTime(f*1.004,t+d*.35);o2.frequency.exponentialRampToValueAtTime(f*.72,t+d);
      lfo.frequency.value=6.5;lg.gain.value=f*.025;lfo.connect(lg);lg.connect(o.frequency);lfo.start(t+d*.35);lfo.stop(t+d+.05)}
    lp.type='lowpass';lp.Q.value=5;
    lp.frequency.setValueAtTime(500,t);lp.frequency.exponentialRampToValueAtTime(droop?1100:1700,t+d*.35);lp.frequency.exponentialRampToValueAtTime(droop?350:600,t+d);
    var g2=AC.createGain();g2.gain.value=.35;
    a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(.085,t+.04);a.gain.setValueAtTime(.085,t+d*.7);a.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(a);a.connect(bus);
    o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);
  }catch(e){}
}
/* game over: the background music stops completely, then a cute fail jingle plays (about 6 s) */
function loseSfx(){
  if(!AC)return;
  MU.hold=true;
  try{if(MU.timer){clearInterval(MU.timer);MU.timer=null}MU.m.gain.cancelScheduledValues(AC.currentTime);MU.m.gain.setTargetAtTime(0,AC.currentTime,.06)}catch(e){}
  if(!sfxOn)return;
  var bt=.5,bus=AC.createGain(),dl=AC.createDelay(.6),fb=AC.createGain(),wet=AC.createGain();
  bus.connect(AC.destination);dl.delayTime.value=.19;fb.gain.value=.38;wet.gain.value=.45;
  bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AC.destination);
  setTimeout(function(){try{bus.disconnect();dl.disconnect();fb.disconnect();wet.disconnect()}catch(e){}},14000);
  /* the classic "wah-wah-wah-waaah" fail jingle, played by a soft toy trombone, then a music box tinkles down and a little boing ends it */
  [[74,0,.4,0],[73,.55,.4,0],[72,1.1,.4,0],[71,1.65,1.9,1]].forEach(function(n){failWah(bus,mHz(n[0]),n[1],n[2],n[3])});
  [88,84,81,79,76,72].forEach(function(n,i){var t=3.9+i*.19;
    tone(mHz(n),t,.7,'sine',.08);tone(mHz(n)*2,t,.3,'sine',.03);tone(mHz(n)*3.01,t,.12,'sine',.015)});
  tone(330,5.15,.28,'sine',.12,110);tone(660,5.15,.2,'triangle',.04,220);
}
function musicUp(){MU.hold=false;try{if(AC&&MU.pg){MU.pg.gain.cancelScheduledValues(AC.currentTime);MU.pg.gain.setValueAtTime(1,AC.currentTime);musicSync()}}catch(e){}}
function showOverlay(kind){
  overlayOpen=true;ovKind=kind;ovAt=nowMs();cancelDrag();
  var win=kind==='win';
  $('ovTitle').textContent=win?'Level Clear!':'No Moves Left!';
  $('ovText').textContent=win?('Cleared '+lines+' lines, collected '+coins+' coins, score '+score+'. Tap PLAY AGAIN for Level '+(level+1)+'.'):('Score '+score+' · Coins '+coins+' · Lines '+lines+'. Tap PLAY AGAIN to start a fresh game.');
  $('btnA').setAttribute('aria-label','Play Again');

/* ================= frame loop ================= */
var last=0;
function frame(now){
  var gap=Math.min(50,(now-last)||16),dt=gap/1000;last=now;
  punch=Math.max(0,punch-dt/.42);
  if(now<freezeUntil){   /* hit-stop: every timeline holds still for a few frames */
    [tw,shocks,flashes,bars,glows,bolts,balls].forEach(function(L){for(var i=0;i<L.length;i++)L[i].t0+=gap});
    dt=0;
  }
  if(Math.abs(($('hud').getBoundingClientRect().bottom)-hudBottom)>1||Math.abs(canvas.clientWidth-W)>1||Math.abs(canvas.clientHeight-H)>1||Math.abs($('dock').getBoundingClientRect().top-trayRect.y)>1)measure();
  if(intro.on&&now-intro.t0>=intro.dur)intro.on=false;

  /* tweens */
  var cur=tw;tw=[];
  cur.forEach(function(a){
    var p=(now-a.t0)/a.dur;
    if(p<0){tw.push(a);return}
    if(a.fn)a.fn(Math.min(1,p));
    if(p>=1){if(a.done)a.done()}else tw.push(a);
  });

  /* particles & coins */
  parts=parts.filter(function(q){
    q.age+=dt;
    if(q.age>=q.life)return false;
    q.vy-=18*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;
    if(q.y<q.floor){q.y=q.floor;q.vy=Math.abs(q.vy)*(q.bounce||.2);q.vx*=.8;q.vz*=.8}
    q.r+=q.vr*dt;
    return true;
  });
  if(shownScore!==score&&now>=scoreHold){
    if(scoreBumpPend){var se=$('score');se.classList.remove('bump','bump2');void se.offsetWidth;se.classList.add(scoreBumpPend>1?'bump2':'bump');scoreBumpPend=0}
    var sdf=score-shownScore;shownScore+=(sdf>0?1:-1)*Math.max(1,Math.ceil(Math.abs(sdf)*Math.min(1,dt*8+.05)));
    if((sdf>0&&shownScore>score)||(sdf<0&&shownScore<score))shownScore=score;
    $('score').textContent=shownScore;
  }
  tutTick(now);
  shake.amp*=.9;if(shake.amp<.01)shake.amp=0;

  /* dragged piece follows the finger */
  if(drag){
    var d=drag,tg=dragTarget(d);
    if(d.sx===null){d.sx=tg.hx;d.sz=tg.hz}
    d.sx+=(tg.hx-d.sx)*.4;d.sz+=(tg.hz-d.sz)*.4;
    updatePreview(tg);
  }
  render(now);
  requestAnimationFrame(frame);
}

/* ================= boot ================= */

/* one pet per level: level 1 is always the cat, level 2 the dog, the dragon comes last; after that the list repeats */
var level=1,MASC_ORDER=[0,1,2,3,4,5,6,7,9,10,8],PILL0=null,CATSRC=null,badgeSeq=0;
var BADGE_ORDER=['bear','peng','dog','cat','panda','chick','frog','fox','rabbit','pig'];
var BADGE_META={'peng':[50.0,77.6,0.99],'dog':[48.8,79.5,0.882],'cat':[49.4,78.7,0.973],'panda':[49.4,78.0,0.982],'chick':[49.9,76.6,1],'frog':[49.4,78.0,1],'fox':[49.5,79.1,0.956],'rabbit':[49.9,78.8,0.931],'pig':[49.4,78.6,0.982],'bear':[50,75.5,1]};
function applyBadge(){
  var k=MASC_ORDER[(level-1)%MASC_ORDER.length];musicTrack(k);
  var an=BADGE_ORDER[(level-1)%BADGE_ORDER.length],lv0=$('lv'),m=BADGE_META[an];
  if(lv0){var is=lv0.querySelectorAll('img.bd');for(var i=0;i<is.length;i++)is[i].classList.toggle('on',is[i].getAttribute('data-a')===an);
    lv0.style.setProperty('--lx',m[0]+'%');lv0.style.setProperty('--ly',m[1]+'%');lv0.style.setProperty('--lk',m[2]);}
  var t=$('lvn');if(t)t.textContent=level;
  var lv=$('lv');if(lv)lv.setAttribute('aria-label','Level '+level);
}
function snapshot(){
  return {shuf:shuffles,level:level,score:score,lines:lines,coins:coins,streak:streak,won:won,over:over,ovk:ovKind,
    grid:grid.map(function(row){return row.map(function(c){return c?{t:c.t,color:c.color,hp:c.hp}:null})}),
    pieces:(pieces||[]).map(function(p){return p?{cells:p.cells,w:p.w,h:p.h,color:p.color}:null})};
}
function restore(data){
  clearBoardMeshes();
  grid=emptyGrid();
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){var x=data.grid[r][c];if(x){var cell={t:x.t,color:x.color,hp:x.hp};grid[r][c]=cell;addCellMesh(cell,r,c)}}
  level=data.level||1;GOAL=9+level;applyBadge();shuffles=data.shuf==null?3:data.shuf;shufUi();
  score=data.score||0;lines=data.lines||0;coins=data.coins||0;streak=data.streak||0;won=!!data.won;over=false;
  pieces=data.pieces;introOn=false;firstSet=false;drag=null;
  for(var i=0;i<3;i++)setTray(i,pieces[i],false);
  if(pieces.every(function(p){return !p}))spawn();
  updateHud(true);
  $('hint').style.opacity=0;
  /* a reload must never skip a finished game: bring the result card back, otherwise re-check for a dead board */
  var ovk=data.ovk||(data.over?'lose':null);
  if(ovk){if(ovk==='lose')over=true;showOverlay(ovk)}
  else later(600,checkLose);
}
function start(data){
  measure();
  if(data&&data.grid&&data.pieces)restore(data);else{level=1;applyBadge();newGame()}
  window.addEventListener('resize',function(){measure()});
  window.addEventListener('orientationchange',function(){measure();setTimeout(measure,300);setTimeout(measure,900)});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',function(){measure()});
  window.addEventListener('load',function(){setTimeout(measure,200);setTimeout(measure,1200)});
  requestAnimationFrame(frame);
  finishLoading();
}
function enterGame(){
  var ld=$('ld');if(!ld||!ld.classList.contains('ready')||ld.classList.contains('done'))return;
  ensureAudio();
  playIntro();
  ld.classList.add('done');setTimeout(function(){ld.style.display='none'},600);

function finishLoading(){

  var wait=Math.max(0,1500-performance.now());
  setTimeout(function(){
    try{var w=fl.getBoundingClientRect().width;fl.style.animation='none';fl.style.width=w+'px';void fl.offsetWidth;fl.style.transition='width .3s ease-out';fl.style.width='100%'}catch(e){}
    setTimeout(function(){ld.classList.add('ready')},380);
  },wait);
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(snapshot);
if($('ld'))$('ld').addEventListener('click',enterGame);
(function(){['score','coins'].forEach(function(id){var el=$(id);if(!el||!window.MutationObserver)return;var p=el.parentNode;function f(){p.setAttribute('data-len',String(el.textContent).length)}new MutationObserver(f).observe(el,{childList:true,characterData:true,subtree:true});f()})})();
function boot(){
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
  else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});

Promise.race([fontReady,new Promise(function(r){setTimeout(r,1200)})]).then(bootWhenReady,bootWhenReady);
